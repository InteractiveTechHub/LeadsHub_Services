networks:
  interactive_net:
    name: interactive_net
    driver: bridge
    ipam:
      config:
        - subnet: 172.19.0.0/16

volumes:
  interactive_data:
  pgadmin4:
  #rabbitmq_data:
  traefik_data:

services:
  # Traefik Reverse Proxy
  traefik:
    image: traefik:v3.0
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # Dashboard do Traefik
    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@example.com}
      - --certificatesresolvers.letsencrypt.acme.storage=/data/acme.json
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_data:/data
    networks:
      interactive_net:
        ipv4_address: 172.19.0.10

  # API .NET
  leadshub_api:
    image: ${DOCKER_REGISTRY-}leadshubapi
    build:
      context: .
      dockerfile: Services/LeadsHub/LeadsHub.Api/Dockerfile
    restart: unless-stopped
    networks:
      interactive_net:
        ipv4_address: 172.19.0.11
    labels:
      - traefik.enable=true
      - traefik.http.routers.leadshub-api.rule=Host(`${DOMAIN:-localhost}`) && PathPrefix(`/api`)
      - traefik.http.routers.leadshub-api.entrypoints=web
      - traefik.http.services.leadshub-api.loadbalancer.server.port=8080
