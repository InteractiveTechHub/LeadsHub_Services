name: Deploy da API com Docker Compose

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Docker Buildx Configuration
        uses: docker/setup-buildx-action@v3

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Services/LeadsHub/LeadsHub.Api/Dockerfile
          push: true
          tags: jsglobaltech/leadhub_webapi:${{ github.sha }}

  transfer:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: copy files to server (Docker Compose)
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          #key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/opt/leadshub/leadshub_webapi"

